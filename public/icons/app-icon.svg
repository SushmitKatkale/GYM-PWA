<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#gradient)"/>
  
  <!-- Dumbbell Icon -->
  <g transform="translate(128, 200)">
    <!-- Left weight -->
    <rect x="0" y="32" width="48" height="96" rx="8" fill="white"/>
    <rect x="8" y="24" width="32" height="112" rx="4" fill="#E5E7EB"/>
    
    <!-- Center bar -->
    <rect x="48" y="64" width="160" height="32" rx="16" fill="white"/>
    <rect x="56" y="72" width="144" height="16" rx="8" fill="#E5E7EB"/>
    
    <!-- Right weight -->
    <rect x="208" y="32" width="48" height="96" rx="8" fill="white"/>
    <rect x="216" y="24" width="32" height="112" rx="4" fill="#E5E7EB"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="380" font-family="Arial, sans-serif" font-size="64" font-weight="bold" text-anchor="middle" fill="white">FE</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
