<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="200" fill="#F8FAFC" rx="8"/>
  
  <!-- Person doing workout -->
  <g transform="translate(100, 50)">
    <!-- Head -->
    <circle cx="50" cy="20" r="12" fill="#F59E0B"/>
    
    <!-- Body -->
    <rect x="45" y="32" width="10" height="30" rx="5" fill="#3B82F6"/>
    
    <!-- Arms -->
    <rect x="30" y="35" width="20" height="6" rx="3" fill="#F59E0B"/>
    <rect x="55" y="35" width="20" height="6" rx="3" fill="#F59E0B"/>
    
    <!-- Legs -->
    <rect x="42" y="62" width="6" height="25" rx="3" fill="#1E40AF"/>
    <rect x="52" y="62" width="6" height="25" rx="3" fill="#1E40AF"/>
    
    <!-- Dumbbell -->
    <rect x="20" y="36" width="16" height="4" rx="2" fill="#6B7280"/>
    <rect x="18" y="34" width="4" height="8" rx="2" fill="#374151"/>
    <rect x="34" y="34" width="4" height="8" rx="2" fill="#374151"/>
  </g>
  
  <!-- Motivational elements -->
  <circle cx="50" cy="50" r="3" fill="#10B981" opacity="0.6"/>
  <circle cx="250" cy="40" r="4" fill="#EF4444" opacity="0.6"/>
  <circle cx="230" cy="160" r="2" fill="#8B5CF6" opacity="0.6"/>
  
  <!-- Text -->
  <text x="150" y="160" font-family="Arial, sans-serif" font-size="18" font-weight="600" text-anchor="middle" fill="#374151">Start Your Fitness Journey</text>
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6B7280">Track workouts, book classes, achieve goals</text>
</svg>
