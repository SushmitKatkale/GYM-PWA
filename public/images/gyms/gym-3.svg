<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#gymGradient3)"/>
  
  <!-- Floor -->
  <rect y="250" width="400" height="50" fill="#374151"/>
  
  <!-- Yoga/wellness equipment -->
  <!-- Yoga mats -->
  <rect x="80" y="220" width="40" height="3" rx="1" fill="#8B5CF6"/>
  <rect x="130" y="220" width="40" height="3" rx="1" fill="#A78BFA"/>
  <rect x="180" y="220" width="40" height="3" rx="1" fill="#C4B5FD"/>
  
  <!-- Meditation cushions -->
  <ellipse cx="280" cy="215" rx="15" ry="8" fill="#7C3AED"/>
  <ellipse cx="320" cy="215" rx="15" ry="8" fill="#8B5CF6"/>
  
  <!-- Plants for zen atmosphere -->
  <rect x="50" y="180" width="4" height="40" fill="#059669"/>
  <ellipse cx="52" cy="175" rx="12" ry="8" fill="#10B981"/>
  
  <rect x="350" y="170" width="4" height="50" fill="#059669"/>
  <ellipse cx="352" cy="165" rx="15" ry="10" fill="#10B981"/>
  
  <!-- Text overlay -->
  <rect x="0" y="0" width="400" height="300" fill="rgba(0,0,0,0.3)"/>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">Zen Fitness Studio</text>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#E5E7EB">Holistic Wellness Center</text>
  
  <defs>
    <linearGradient id="gymGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
