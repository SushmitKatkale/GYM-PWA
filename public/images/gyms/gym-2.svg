<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="url(#gymGradient2)"/>
  
  <!-- Floor -->
  <rect y="250" width="400" height="50" fill="#374151"/>
  
  <!-- CrossFit equipment -->
  <!-- Pull-up bar -->
  <rect x="80" y="120" width="4" height="80" fill="#1F2937"/>
  <rect x="316" y="120" width="4" height="80" fill="#1F2937"/>
  <rect x="80" y="120" width="240" height="6" rx="3" fill="#1F2937"/>
  
  <!-- Olympic bars -->
  <rect x="150" y="220" width="100" height="4" rx="2" fill="#6B7280"/>
  <rect x="200" y="230" width="100" height="4" rx="2" fill="#6B7280"/>
  
  <!-- Weight plates -->
  <circle cx="140" cy="222" r="12" fill="#374151"/>
  <circle cx="360" cy="222" r="12" fill="#374151"/>
  <circle cx="190" cy="232" r="10" fill="#4B5563"/>
  <circle cx="310" cy="232" r="10" fill="#4B5563"/>
  
  <!-- Text overlay -->
  <rect x="0" y="0" width="400" height="300" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="160" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">PowerHouse Gym</text>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#E5E7EB">Hardcore Training Facility</text>
  
  <defs>
    <linearGradient id="gymGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
