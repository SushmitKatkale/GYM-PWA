<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon -->
  <rect x="8" y="8" width="44" height="44" rx="8" fill="url(#logoGradient)"/>
  
  <!-- Dumbbell in icon -->
  <g transform="translate(18, 24)">
    <!-- Left weight -->
    <rect x="0" y="4" width="6" height="12" rx="1" fill="white"/>
    <!-- Center bar -->
    <rect x="6" y="8" width="12" height="4" rx="2" fill="white"/>
    <!-- Right weight -->
    <rect x="18" y="4" width="6" height="12" rx="1" fill="white"/>
  </g>
  
  <!-- Text -->
  <text x="64" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1F2937">FItEsperro</text>
  <text x="64" y="42" font-family="Arial, sans-serif" font-size="12" fill="#6B7280">Fitness Management System</text>
  
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
